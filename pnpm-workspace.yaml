  "@foldworks/agent": file:./vendor/foldworks-agent-0.1.0.tgz
  "@foldworks/code-editor": file:./vendor/foldworks-code-editor-0.1.0.tgz
  "@foldworks/history": file:./vendor/foldworks-history-0.1.1.tgz
  "@foldworks/keyboard": file:./vendor/foldworks-keyboard-0.2.0.tgz
  "@foldworks/outliner": file:./vendor/foldworks-outliner-0.0.0.tgz
  "@foldworks/text-intelligence": file:./vendor/foldworks-text-intelligence-0.0.0.tgz
  "@foldworks/ui": file:./vendor/foldworks-ui-0.2.0.tgz
