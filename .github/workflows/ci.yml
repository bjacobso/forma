name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript, TypeScript, and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @formalang/website exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - run: pnpm website:dry-run

  ocaml:
    name: OCaml engine and parity suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: pnpm install --frozen-lockfile
      - run: opam install -y dune.3.20.2 js_of_ocaml.6.2.0 js_of_ocaml-compiler.6.2.0 wasm_of_ocaml-compiler.6.2.0
      - run: opam exec -- pnpm test:ocaml
      - run: pnpm build:js
      - run: pnpm --filter @formalang/language-server build:release
      - run: pnpm pack:check
