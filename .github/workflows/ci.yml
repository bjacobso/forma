name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript, TypeScript, and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/install
      - name: Check deployment CLI startup
        run: pnpm exec alchemy --help
      # Version PRs have already consumed their changesets. Check release-note
      # coverage on ordinary PRs, before versioning removes those files.
      - name: Check changesets
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm check:changesets
      - run: pnpm check
      - name: Guard prelude startup latency
        run: node scripts/bench-prelude-startup.mjs --check
      - name: Report latency budget
        continue-on-error: true
        run: pnpm bench:latency --out scripts/benchmarks/latency-results.json
      - name: Preserve latency report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: scripts/benchmarks/latency-results.json
          retention-days: 30
      - run: pnpm pack:check
      - run: pnpm check:tarball
      - run: pnpm check:examples
      - run: pnpm --filter @formalang/website exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - run: pnpm website:build
      - run: pnpm website:dry-run
      - run: pnpm test:site
      - name: Preserve browser traces and Wrangler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-failure-diagnostics
          path: |
            apps/website/test-results/
            ~/.config/.wrangler/logs/
          include-hidden-files: true
          retention-days: 7
