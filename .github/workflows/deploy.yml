name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Forma docs
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://forma-lang.com
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/install
      - name: Deploy production
        run: pnpm exec alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production
        run: |
          response="$(mktemp)"
          for path in / /vision /language /roots-of-lisp /playground /playground/demo/types; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --output "$response" "https://forma-lang.com$path"
            grep --quiet '<title>.*Forma.*</title>' "$response"
          done
          expected="$(node --input-type=module -e 'import { FORMA_WORKBENCH_URL } from "./apps/website/src/lib/workbenchLocation.ts"; process.stdout.write(FORMA_WORKBENCH_URL)')"
          for path in /workbench/demo /workbench/demo/; do
            redirect="$(curl --fail --silent --show-error --output /dev/null \
              --write-out '%{http_code} %{redirect_url}' "https://forma-lang.com$path")"
            test "$redirect" = "302 $expected"
          done
