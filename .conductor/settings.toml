"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "node scripts/setup-workspace.mjs"
run_mode = "concurrent"

[scripts.run.website]
available_in = [ "local" ]
command = "pnpm --filter @formalang/website dev --host 0.0.0.0 --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.test]
command = "pnpm test:js"
icon = "test-tube"

[scripts.run.check]
command = "pnpm check"
icon = "check-check"
